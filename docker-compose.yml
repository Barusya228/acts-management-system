services:
  db:
    image: postgres:15-alpine
    container_name: acts_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: acts_user
      POSTGRES_PASSWORD: acts_password
      POSTGRES_DB: acts_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - acts_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acts_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://acts_user:acts_password@db:5432/acts_db
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      CORS_ORIGINS: '["http://localhost:3000"]'
      CORS_ORIGIN_REGEX: '^https?://.+(:\d+)?$'
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/storage:/app/storage
    depends_on:
      - db
    networks:
      - acts_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: acts_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - acts_network
    command: npm run dev

volumes:
  postgres_data:

networks:
  acts_network:
    driver: bridge
