services:
  db:
    image: postgres:15-alpine
    container_name: acts_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: acts_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acts_password}
      POSTGRES_DB: acts_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - acts_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: acts_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://acts_user:${POSTGRES_PASSWORD:-acts_password}@db:5432/acts_db
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required - generate with openssl rand -hex 32}"
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: '["http://localhost:5000"]'
      CORS_ORIGIN_REGEX: '^https?://.+(:\d+)?$'
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5000}
      AD_ENABLED: ${AD_ENABLED:-false}
      AD_SERVER: ${AD_SERVER:-}
      AD_PORT: ${AD_PORT:-389}
      AD_USER: ${AD_USER:-}
      AD_PASSWORD: ${AD_PASSWORD:-}
      AD_SEARCH_BASE: ${AD_SEARCH_BASE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      PDF_BACKUP_ENABLED: ${PDF_BACKUP_ENABLED:-false}
      PDF_BACKUP_PATH: /app/pdf-backups
      PDF_BACKUP_LABEL: ${PDF_BACKUP_LABEL:-Google Drive}
    ports:
      - "5000:8000"
    volumes:
      - ./backend/storage:/app/storage
      - type: bind
        source: ${PDF_BACKUP_HOST_PATH:-./backend/pdf-backups}
        target: /app/pdf-backups
        bind:
          create_host_path: false
    depends_on:
      - db
    networks:
      - acts_network

  email-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: acts_email_worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.email_outbox_worker"]
    environment:
      DATABASE_URL: postgresql://acts_user:${POSTGRES_PASSWORD:-acts_password}@db:5432/acts_db
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required - generate with openssl rand -hex 32}"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      STORAGE_PATH: /app/storage
    volumes:
      - ./backend/storage:/app/storage:ro
    depends_on:
      - db
      - backend
    networks:
      - acts_network

volumes:
  postgres_data:

networks:
  acts_network:
    driver: bridge
