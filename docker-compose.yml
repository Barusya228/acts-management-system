services:
  postgres:
    image: postgres:15-alpine
    container_name: acts_postgres
    environment:
      POSTGRES_DB: acts_db
      POSTGRES_USER: acts_user
      POSTGRES_PASSWORD: acts_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acts_user -d acts_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: acts_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://acts_user:acts_password@postgres:5432/acts_db
      SECRET_KEY: your-secret-key-change-in-production-min-32-chars
      ADMIN_PASSWORD: admin123
      STORAGE_PATH: /app/storage
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python scripts/seed_templates.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    container_name: acts_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
