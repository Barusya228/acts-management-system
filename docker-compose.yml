version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: acts_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acts_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acts_password}
      POSTGRES_DB: ${POSTGRES_DB:-acts_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acts_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acts_backend
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acts_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acts_password}
      POSTGRES_DB: ${POSTGRES_DB:-acts_db}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-acts_user}:${POSTGRES_PASSWORD:-acts_password}@postgres:5432/${POSTGRES_DB:-acts_db}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production-min-32-chars}
      STORAGE_PATH: /app/storage
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@acts.local}
      SMTP_TLS: ${SMTP_TLS:-true}
    volumes:
      - ./backend/storage:/app/storage
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "sleep 2 && alembic upgrade head && python scripts/seed_templates.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: acts_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:

